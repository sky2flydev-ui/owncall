<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OwnCall — self-hosted звонки</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell"><section class="hero"><div class="eyebrow">OWNCALL / WEBRTC</div><h1>Звонки без чужого медиасервера.</h1><p>Self-hosted аудио- и видеозвонки: браузеры соединяются напрямую, сервер отвечает только за сигналинг.</p></section>
<section class="card" id="setup"><label>Комната<input id="room" value="demo-room" maxlength="64"></label><label>Ваше имя<input id="name" placeholder="Например, Alex" maxlength="32"></label><button id="join">Войти в звонок</button><p class="hint">Для локального теста откройте эту страницу в двух вкладках.</p></section>
<section class="call hidden" id="call"><div class="toolbar"><div><span class="status-dot"></span><span id="status">Подключение…</span></div><button class="secondary" id="leave">Выйти</button></div><div class="videos"><div class="video-card"><video id="local" autoplay muted playsinline></video><span>Вы</span></div><div id="remote-list" class="remote-list"></div></div><div class="controls"><button id="mute">Выключить микрофон</button><button id="camera">Выключить камеру</button></div></section>
<footer>Медиа: WebRTC P2P · Сигналинг: ваш Go-сервер · Лицензия MIT</footer></main><script src="/config.js"></script><script src="/app.js"></script></body></html>
