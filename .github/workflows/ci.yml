name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
